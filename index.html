<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkless - Sign Anything, Print Nothing</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>
    <div class="app-container">
      <header class="glass-header">
        <img src="./inkless-header.png" alt="Inkless — Sign Anything, Print Nothing" class="header-image" />
      </header>

      <main class="main-content">
        <!-- Initial Dropzone View -->
        <div id="dropzone" class="glass-panel dropzone active">
          <i class="upload-icon fa-solid fa-file-arrow-up"></i>
          <h2>Drag & Drop your Document</h2>
          <p>or click to browse</p>
          <p class="file-hint">Supports PDF, PNG, JPG</p>
          <input type="file" id="fileInput" accept="application/pdf, image/png, image/jpeg" hidden />
        </div>

        <!-- Editor View (Hidden initially) -->
        <div id="editor-container" class="glass-panel editor-container">
          <div class="toolbar">
            <button id="btn-close" class="btn btn-secondary">
              <i class="fa-solid fa-xmark"></i>
              <span class="btn-label">Close</span>
            </button>
            <div class="toolbar-center">
              <div class="mode-toggle">
                <button id="btn-mode-view" class="btn-mode active">
                  <i class="fa-solid fa-eye"></i>
                  <span class="btn-label">View</span>
                </button>
                <button id="btn-mode-sign" class="btn-mode">
                  <i class="fa-solid fa-signature"></i>
                  <span class="btn-label">Sign</span>
                </button>
                <button id="btn-mode-place" class="btn-mode">
                  <i class="fa-solid fa-stamp"></i>
                  <span class="btn-label">Place</span>
                </button>
              </div>
              <div id="signing-controls" class="signing-controls hidden">
                <input type="color" id="colorPicker" value="#000000" title="Ink color" />
                <input type="range" id="thicknessSlider" min="1" max="8" value="3" title="Pen size" />
                <div class="clear-dropdown">
                  <button id="btn-clear-toggle" class="btn btn-outline clear-toggle">
                    <i class="fa-solid fa-eraser"></i>
                    <span class="btn-label">Clear</span>
                    <i class="fa-solid fa-chevron-down" style="font-size:0.7em"></i>
                  </button>
                  <div class="clear-menu" id="clear-menu">
                    <button id="btn-clear" class="clear-option">Clear Page</button>
                    <button id="btn-clear-all" class="clear-option">Clear All</button>
                  </div>
                </div>
              </div>
              <span id="page-indicator" class="page-indicator"></span>
            </div>
            <button id="btn-download" class="btn btn-primary">
              <i class="fa-solid fa-download"></i>
              <span class="btn-label">Save PDF</span>
            </button>
          </div>
          
          <!-- Scrollable pages container -->
          <div id="pages-container" class="pages-container"></div>

          <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p>Processing...</p>
          </div>
        </div>
      </main>
      
      <footer class="footer">
        <p>All processing is done locally in your browser. No data leaves your device.</p>
      </footer>
    </div>
    <script type="module" src="/main.js"></script>
    <a href="https://www.buymeacoffee.com/bhartman21" target="_blank" rel="noopener noreferrer" class="bmc-button">☕ Buy me a coffee</a>
    <div id="place-modal">
      <div class="place-modal-inner">
        <div class="place-modal-toolbar">
          <button id="place-btn-clear" class="btn btn-outline">Clear</button>
          <span class="place-modal-hint">Draw your signature</span>
          <div class="place-modal-actions">
            <button id="place-btn-cancel" class="btn btn-secondary">Cancel</button>
            <button id="place-btn-apply" class="btn btn-primary">Apply</button>
          </div>
        </div>
        <canvas id="place-canvas"></canvas>
      </div>
    </div>
  </body>
</html>
